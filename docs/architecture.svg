<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">StockWise Soweto architecture</title><desc id="desc">Browser, Flask application layers, standalone model and MySQL database with deployment components.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0a6b4b"/></marker></defs>
  <rect width="1200" height="700" fill="#f5f3ec"/><text x="70" y="70" font-family="Arial" font-size="32" font-weight="700" fill="#18231f">StockWise Soweto - system architecture</text><text x="70" y="100" font-family="Arial" font-size="16" fill="#66736d">Required Flask/MySQL stack with framework-independent supply-chain logic</text>
  <g filter="url(#s)"><rect x="70" y="170" width="230" height="360" rx="20" fill="#fff"/><rect x="350" y="150" width="500" height="400" rx="20" fill="#fff"/><rect x="900" y="170" width="230" height="360" rx="20" fill="#fff"/></g>
  <text x="105" y="210" font-family="Arial" font-size="20" font-weight="700" fill="#0a6b4b">Presentation</text><rect x="105" y="245" width="160" height="68" rx="12" fill="#dff1e9"/><text x="185" y="275" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#064934">Mobile browser</text><text x="185" y="296" text-anchor="middle" font-family="Arial" font-size="12" fill="#356b58">HTML + CSS + JS</text><rect x="105" y="345" width="160" height="68" rx="12" fill="#e1eef7"/><text x="185" y="375" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#194c71">Jinja templates</text><text x="185" y="396" text-anchor="middle" font-family="Arial" font-size="12" fill="#436b86">Accessible UI states</text>
  <text x="385" y="190" font-family="Arial" font-size="20" font-weight="700" fill="#0a6b4b">Flask application</text><rect x="390" y="225" width="190" height="95" rx="12" fill="#f3f5f1"/><text x="485" y="258" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#18231f">Web + auth</text><text x="485" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#66736d">Flask-Login, roles</text><text x="485" y="300" text-anchor="middle" font-family="Arial" font-size="12" fill="#66736d">server-rendered views</text><rect x="620" y="225" width="190" height="95" rx="12" fill="#f3f5f1"/><text x="715" y="258" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#18231f">REST API</text><text x="715" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#66736d">validation, filtering</text><text x="715" y="300" text-anchor="middle" font-family="Arial" font-size="12" fill="#66736d">pagination, errors</text><rect x="390" y="365" width="190" height="115" rx="12" fill="#fff0d8"/><text x="485" y="400" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#82470d">Service layer</text><text x="485" y="423" text-anchor="middle" font-family="Arial" font-size="12" fill="#805b2e">orders, movements</text><text x="485" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#805b2e">transaction handling</text><rect x="620" y="365" width="190" height="115" rx="12" fill="#dff1e9"/><text x="715" y="400" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#064934">Python model</text><text x="715" y="423" text-anchor="middle" font-family="Arial" font-size="12" fill="#356b58">target stock + cover</text><text x="715" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#356b58">budget + storage</text>
  <text x="935" y="210" font-family="Arial" font-size="20" font-weight="700" fill="#0a6b4b">Data + operations</text><rect x="935" y="245" width="160" height="78" rx="12" fill="#e1eef7"/><text x="1015" y="278" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#194c71">MySQL 8</text><text x="1015" y="300" text-anchor="middle" font-family="Arial" font-size="12" fill="#436b86">3NF + constraints</text><rect x="935" y="352" width="160" height="78" rx="12" fill="#f3f5f1"/><text x="1015" y="385" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#18231f">Gunicorn</text><text x="1015" y="407" text-anchor="middle" font-family="Arial" font-size="12" fill="#66736d">2 worker processes</text><rect x="935" y="459" width="160" height="40" rx="12" fill="#fde8e6"/><text x="1015" y="484" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#852824">Rotating logs</text>
