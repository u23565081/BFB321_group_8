<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">StockWise Soweto entity relationship diagram</title><desc id="desc">Nine normalized database tables and their key relationships.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#708078"/></marker></defs><rect width="1500" height="980" fill="#f5f3ec"/><text x="55" y="60" font-family="Arial" font-size="30" font-weight="700" fill="#18231f">StockWise Soweto - ER diagram</text><text x="55" y="90" font-family="Arial" font-size="15" fill="#66736d">Primary keys (PK), foreign keys (FK) and selected constraints/indexes</text>
  <g stroke="#708078" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M290 230 H370"/><path d="M620 230 H700"/><path d="M950 230 H1030"/><path d="M830 350 V430"/><path d="M1155 350 V430"/><path d="M620 555 H700"/><path d="M950 555 H1030"/><path d="M290 700 H370"/><path d="M620 700 H700"/><path d="M500 350 V625"/></g>
  <g font-family="Arial" filter="url(#s)">
    <g transform="translate(55 150)"><rect width="235" height="200" rx="15" fill="#fff"/><rect width="235" height="48" rx="15" fill="#0a6b4b"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">users</text><text x="16" y="76" font-size="13" fill="#18231f">PK id</text><text x="16" y="100" font-size="13" fill="#18231f">email (unique)</text><text x="16" y="124" font-size="13" fill="#18231f">password_hash</text><text x="16" y="148" font-size="13" fill="#18231f">role</text><text x="16" y="178" font-size="11" fill="#66736d">created_at · updated_at</text></g>
    <g transform="translate(370 150)"><rect width="250" height="200" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#0a6b4b"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">shops</text><text x="16" y="76" font-size="13">PK id · FK owner_user_id</text><text x="16" y="100" font-size="13">code (unique) · name</text><text x="16" y="124" font-size="13">cash_budget</text><text x="16" y="148" font-size="13">storage_capacity_units</text><text x="16" y="172" font-size="13">review + safety days</text></g>
    <g transform="translate(700 150)"><rect width="250" height="200" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#286490"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">inventory_balances</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">FK shop_id · product_id</text><text x="16" y="124" font-size="13">on_hand ≥ 0</text><text x="16" y="154" font-size="11" fill="#66736d">UNIQUE (shop_id, product_id)</text><text x="16" y="177" font-size="11" fill="#66736d">composite lookup index</text></g>
    <g transform="translate(1030 150)"><rect width="250" height="200" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#b76a19"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">products</text><text x="16" y="76" font-size="13">PK id · FK supplier_id</text><text x="16" y="100" font-size="13">sku (unique) · name</text><text x="16" y="124" font-size="13">pack_size · unit_cost</text><text x="16" y="148" font-size="13">storage_units_per_item</text><text x="16" y="172" font-size="13">category · active</text></g>
    <g transform="translate(700 430)"><rect width="250" height="250" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#286490"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">stock_movements</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">FK shop_id · product_id</text><text x="16" y="124" font-size="13">movement_type</text><text x="16" y="148" font-size="13">quantity ≠ 0 · note</text><text x="16" y="178" font-size="11" fill="#66736d">INDEX (shop, product, date)</text><text x="16" y="205" font-size="11" fill="#66736d">Append-only audit record</text></g>
    <g transform="translate(1030 430)"><rect width="250" height="250" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#286490"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">demand_history</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">FK shop_id · product_id</text><text x="16" y="124" font-size="13">demand_date</text><text x="16" y="148" font-size="13">quantity_sold ≥ 0</text><text x="16" y="178" font-size="11" fill="#66736d">UNIQUE (shop, product, date)</text><text x="16" y="205" font-size="11" fill="#66736d">14-day demand input</text></g>
    <g transform="translate(55 625)"><rect width="235" height="220" rx="15" fill="#fff"/><rect width="235" height="48" rx="15" fill="#b76a19"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">suppliers</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">name · contact_phone</text><text x="16" y="124" font-size="13">lead_time_days</text><text x="16" y="148" font-size="13">delivery_fee</text><text x="16" y="180" font-size="11" fill="#66736d">lead time and fee ≥ 0</text></g>
    <g transform="translate(370 625)"><rect width="250" height="220" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#0a6b4b"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">orders</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">FK shop_id · supplier_id</text><text x="16" y="124" font-size="13">status · total_cost</text><text x="16" y="148" font-size="13">placed · expected · received</text><text x="16" y="180" font-size="11" fill="#66736d">INDEX (shop, status, date)</text></g>
    <g transform="translate(700 730)"><rect width="250" height="200" rx="15" fill="#fff"/><rect width="250" height="48" rx="15" fill="#0a6b4b"/><text x="18" y="30" font-size="17" font-weight="700" fill="#fff">order_lines</text><text x="16" y="76" font-size="13">PK id</text><text x="16" y="100" font-size="13">FK order_id · product_id</text><text x="16" y="124" font-size="13">quantity_ordered</text><text x="16" y="148" font-size="13">quantity_received · unit_cost</text><text x="16" y="176" font-size="11" fill="#66736d">UNIQUE (order_id, product_id)</text></g>
  </g>
  <text x="1100" y="900" font-family="Arial" font-size="12" fill="#66736d">Crow's-foot meaning is stated in text: each parent may have many child records; each child has one parent.</text>
</svg>
