openapi: 3.0.3
info:
  title: StockWise Soweto API
  version: 1.0.0
  description: Authenticated REST API for inventory, replenishment and supplier orders.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /products:
    get:
      summary: List products with pagination and optional filters
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: category, in: query, description: Exact category match, schema: {type: string}}
        - {name: active, in: query, schema: {type: string, enum: ['true', 'false', '1', '0']}}
        - {name: q, in: query, description: Product name or SKU filter, schema: {type: string}}
      responses:
        '200': {description: Paginated products, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedProducts'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorised'}
    post:
      summary: Create a product (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201': {description: Product created, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /products/{product_id}:
    parameters:
      - {name: product_id, in: path, required: true, schema: {type: integer}}
    get:
      summary: Return one product
      responses:
        '200': {description: The product, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Update a product's editable fields (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200': {description: Product updated, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory:
    get:
      summary: List inventory balances
      parameters:
        - {name: shop_id, in: query, required: true, schema: {type: integer}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
        - {name: q, in: query, description: Product name or SKU filter, schema: {type: string}}
      responses:
        '200': {description: Paginated inventory balances, content: {application/json: {schema: {$ref: '#/components/schemas/PaginatedInventory'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
  /movements:
    post:
      summary: Record a sale, receipt, loss, return or adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovementInput'}
      responses:
        '201': {description: Stock movement recorded}
        '400': {$ref: '#/components/responses/ValidationError'}
  /recommendations:
    get:
      summary: Calculate a supplier basket under cash and storage constraints
      parameters:
        - {name: shop_id, in: query, required: true, schema: {type: integer}}
        - {name: supplier_id, in: query, required: true, schema: {type: integer}}
        - {name: budget, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200': {description: Replenishment items and basket totals, content: {application/json: {schema: {$ref: '#/components/schemas/Recommendations'}}}}
  /orders:
    get:
      summary: List orders with pagination and optional status filter
      parameters:
        - {name: shop_id, in: query, required: true, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [draft, approved, placed, received, cancelled]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Paginated orders}
    post:
      summary: Create a draft supplier order
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201': {description: Draft order created}
        '400': {$ref: '#/components/responses/ValidationError'}
  /orders/{order_id}:
    get:
      summary: Return one accessible order with its lines
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: The order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{order_id}/approve:
    post:
      summary: Approve a draft after cash and storage checks
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Order approved}
        '409': {description: Invalid status or constraint violation}
  /orders/{order_id}/receive:
    post:
      summary: Receive every outstanding line and update the stock ledger
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Order received and stock balances updated}
        '409': {description: Invalid order status}
  /shops/{shop_id}:
    patch:
      summary: Update a shop's reorder settings
      parameters:
        - {name: shop_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShopSettingsInput'}
      responses:
        '200': {description: Saved settings, content: {application/json: {schema: {$ref: '#/components/schemas/ShopSettings'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorised:
      description: A signed-in session is required
    ValidationError:
      description: Input failed validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: The signed-in user may not perform this action
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: The record does not exist or belongs to another owner
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The change conflicts with existing data, such as a duplicate SKU
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        fields: {type: array, items: {type: string}}
    MovementInput:
      type: object
      required: [shop_id, product_id, movement_type, quantity]
      properties:
        shop_id: {type: integer}
        product_id: {type: integer}
        movement_type: {type: string, enum: [sale, loss, receipt, return, adjustment_in, adjustment_out]}
        quantity: {type: integer, minimum: 1}
        note: {type: string, maxLength: 255}
    InventoryItem:
      type: object
      properties:
        product_id: {type: integer}
        sku: {type: string}
        name: {type: string}
        on_hand: {type: integer, minimum: 0}
        stock_value: {type: number}
        status: {type: string, enum: [healthy, low, out]}
    PaginatedInventory:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InventoryItem'}}
        page: {type: integer}
        pages: {type: integer}
        total: {type: integer}
    OrderInput:
      type: object
      required: [shop_id, supplier_id, lines]
      properties:
        shop_id: {type: integer}
        supplier_id: {type: integer}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: integer}
              quantity: {type: integer, minimum: 1}
    Recommendations:
      type: object
      properties:
        items: {type: array, items: {type: object}}
        totals:
          type: object
          properties:
            product_cost: {type: number}
            delivery_fee: {type: number}
            total_cost: {type: number}
        provisional: {type: boolean}
        message: {type: string}
    Product:
      type: object
      properties:
        id: {type: integer}
        sku: {type: string}
        name: {type: string}
        category: {type: string}
        pack_size: {type: integer, minimum: 1}
        unit_cost: {type: number}
        supplier_id: {type: integer}
        storage_units_per_item: {type: number}
        active: {type: boolean}
    ProductInput:
      type: object
      required: [sku, name, category, pack_size, unit_cost, supplier_id]
      additionalProperties: false
      properties:
        sku: {type: string, maxLength: 40}
        name: {type: string, maxLength: 120}
        category: {type: string, maxLength: 80}
        pack_size: {type: integer, minimum: 1}
        unit_cost: {type: number, minimum: 0, maximum: 99999999.99}
        supplier_id: {type: integer, minimum: 1, description: Must identify an existing supplier}
        storage_units_per_item: {type: number, minimum: 0.001, maximum: 99999.999}
        active: {type: boolean}
    ProductUpdate:
      type: object
      description: Any subset of the editable fields; sku and supplier_id cannot be changed.
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 120}
        category: {type: string, maxLength: 80}
        pack_size: {type: integer, minimum: 1}
        unit_cost: {type: number, minimum: 0, maximum: 99999999.99}
        storage_units_per_item: {type: number, minimum: 0.001, maximum: 99999.999}
        active: {type: boolean}
    PaginatedProducts:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        page: {type: integer}
        pages: {type: integer}
        total: {type: integer}
    Order:
      type: object
      properties:
        id: {type: integer}
        status: {type: string, enum: [draft, approved, placed, received, cancelled]}
        supplier: {type: string}
        supplier_id: {type: integer}
        total_cost: {type: number}
        delivery_fee: {type: number}
        created_at: {type: string, format: date-time}
        expected_at: {type: string, format: date-time, nullable: true}
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: {type: integer}
              product: {type: string}
              quantity_ordered: {type: integer}
              quantity_received: {type: integer}
              unit_cost: {type: number}
    ShopSettingsInput:
      type: object
      description: Any subset of the reorder settings.
      additionalProperties: false
      properties:
        cash_budget: {type: number, minimum: 0, maximum: 9999999999.99}
        storage_capacity_units: {type: integer, minimum: 0}
        review_period_days: {type: integer, minimum: 1}
        safety_stock_days: {type: integer, minimum: 0}
    ShopSettings:
      type: object
      properties:
        id: {type: integer}
        cash_budget: {type: number}
        storage_capacity_units: {type: integer}
        review_period_days: {type: integer}
        safety_stock_days: {type: integer}

