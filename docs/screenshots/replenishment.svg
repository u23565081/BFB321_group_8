<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">StockWise replenishment planner preview</title><desc id="d">Desktop planner with supplier and budget controls, recommendation table and basket total.</desc><defs><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".08"/></filter></defs><rect width="1200" height="720" fill="#f5f3ec"/><rect width="1200" height="72" fill="#faf8f2"/><line x1="0" y1="72" x2="1200" y2="72" stroke="#dedfd8"/><rect x="48" y="16" width="40" height="40" rx="11" fill="#0a6b4b"/><text x="68" y="41" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">SW</text><text x="101" y="32" font-family="Arial" font-size="16" font-weight="700" fill="#18231f">StockWise</text><text x="101" y="49" font-family="Arial" font-size="10" letter-spacing="2" fill="#66736d">SOWETO</text><g font-family="Arial" font-size="13" font-weight="700" fill="#66736d"><text x="560" y="41">Overview</text><text x="645" y="41">Stock</text><rect x="700" y="14" width="98" height="44" rx="10" fill="#e5eee8"/><text x="749" y="41" text-anchor="middle" fill="#064934">Replenish</text><text x="825" y="41">Orders</text><text x="897" y="41">Impact</text></g>
  <text x="48" y="116" font-family="Arial" font-size="11" font-weight="700" letter-spacing="1.7" fill="#0a6b4b">F2-F4 · TIMELY AND AFFORDABLE ORDERING</text><text x="48" y="161" font-family="Arial" font-size="39" font-weight="700" fill="#18231f">Replenishment planner</text><text x="48" y="190" font-family="Arial" font-size="15" fill="#66736d">Build a full-pack basket using recent demand, delivery time, cash and storage.</text>
  <g filter="url(#s)" font-family="Arial"><rect x="48" y="220" width="1104" height="128" rx="17" fill="#fff" stroke="#dedfd8"/><text x="72" y="251" font-size="11" font-weight="700" fill="#18231f">Supplier</text><rect x="72" y="263" width="500" height="44" rx="9" fill="#fff" stroke="#cfd3ce"/><text x="88" y="290" font-size="12" font-weight="700" fill="#18231f">Jozi Wholesale Goods · 2 day lead time</text><text x="600" y="251" font-size="11" font-weight="700" fill="#18231f">Cash available (R)</text><rect x="600" y="263" width="300" height="44" rx="9" fill="#fff" stroke="#cfd3ce"/><text x="616" y="290" font-size="12" fill="#18231f">2500</text><rect x="920" y="263" width="208" height="44" rx="10" fill="#0a6b4b"/><text x="1024" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Calculate basket</text><text x="72" y="329" font-size="10" fill="#66736d">Uses 14 days of demand, 3-day review periods and 1 day of safety stock.</text></g>
  <rect x="48" y="366" width="1104" height="42" rx="10" fill="#dff1e9" stroke="#c7e2d5"/><text x="64" y="392" font-family="Arial" font-size="11" fill="#345b4d">Recommendations use the latest 14 days of demand.</text>
  <g filter="url(#s)" font-family="Arial"><rect x="48" y="426" width="1104" height="250" rx="17" fill="#fff" stroke="#dedfd8"/><text x="72" y="461" font-size="18" font-weight="700" fill="#18231f">Suggested basket</text><text x="72" y="482" font-size="11" fill="#66736d">Priority goes to products with the fewest days of cover.</text><rect x="970" y="448" width="157" height="24" rx="12" fill="#e1eef7"/><text x="1048" y="464" text-anchor="middle" font-size="9" font-weight="700" fill="#194c71">OWNER APPROVAL REQUIRED</text><rect x="48" y="508" width="1104" height="36" fill="#f7f7f2"/><g font-size="9" font-weight="700" fill="#66736d"><text x="72" y="531">PRODUCT</text><text x="390" y="531">DEMAND/DAY</text><text x="520" y="531">COVER</text><text x="634" y="531">TARGET</text><text x="748" y="531">SUGGESTED</text><text x="870" y="531">BASKET QTY</text><text x="1015" y="531">LINE COST</text></g><g font-size="11" fill="#18231f"><text x="72" y="573" font-weight="700">Tea biscuits 200 g</text><text x="72" y="588" font-size="9" fill="#66736d">BISCUIT-200</text><text x="405" y="579">3.1</text><text x="520" y="579">5.7 days</text><text x="645" y="579">19</text><text x="766" y="579">24</text><text x="892" y="579" font-weight="700">24</text><text x="1023" y="579">R180.00</text><line x1="72" y1="604" x2="1128" y2="604" stroke="#ecece7"/><text x="72" y="635" font-weight="700">Household candles 6 pack</text><text x="405" y="635">3.0</text><text x="520" y="635">2.7 days</text><text x="645" y="635">18</text><text x="766" y="635">12</text><text x="892" y="635" font-weight="700">12</text><text x="1023" y="635">R216.00</text></g></g>
  <rect x="792" y="648" width="360" height="54" fill="#f8faf7"/><text x="814" y="671" font-family="Arial" font-size="9" fill="#66736d">TOTAL BASKET</text><text x="814" y="692" font-family="Arial" font-size="18" font-weight="700" fill="#064934">R1,945.00</text><rect x="980" y="660" width="148" height="32" rx="8" fill="#0a6b4b"/><text x="1054" y="680" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff">Create draft order</text>
