<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">StockWise dashboard preview</title><desc id="d">Desktop dashboard with stock value, low-stock items, stockouts, orders and daily actions.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".08"/></filter></defs>
  <rect width="1200" height="720" fill="#f5f3ec"/><rect width="1200" height="72" fill="#faf8f2"/><line x1="0" y1="72" x2="1200" y2="72" stroke="#dedfd8"/>
  <rect x="48" y="16" width="40" height="40" rx="11" fill="#0a6b4b"/><text x="68" y="41" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">SW</text><text x="101" y="32" font-family="Arial" font-size="16" font-weight="700" fill="#18231f">StockWise</text><text x="101" y="49" font-family="Arial" font-size="10" letter-spacing="2" fill="#66736d">SOWETO</text>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#66736d"><rect x="540" y="14" width="92" height="44" rx="10" fill="#e5eee8"/><text x="586" y="41" text-anchor="middle" fill="#064934">Overview</text><text x="667" y="41">Stock</text><text x="734" y="41">Replenish</text><text x="826" y="41">Orders</text><text x="897" y="41">Impact</text></g><text x="1040" y="31" font-family="Arial" font-size="12" font-weight="700" fill="#18231f">Thandi Mokoena</text><text x="1065" y="48" font-family="Arial" font-size="10" fill="#66736d">Owner</text>
  <text x="48" y="118" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#0a6b4b">SOW-01</text><text x="48" y="168" font-family="Arial" font-size="42" font-weight="700" fill="#18231f">Good day, Thandi</text><text x="48" y="197" font-family="Arial" font-size="15" fill="#66736d">Here is what needs attention at Thandi's Spaza.</text><rect x="998" y="137" width="154" height="48" rx="10" fill="#0a6b4b"/><text x="1075" y="166" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Prepare an order</text>
  <g filter="url(#s)" font-family="Arial"><g transform="translate(48 232)"><rect width="260" height="132" rx="17" fill="#fff" stroke="#dedfd8"/><rect x="20" y="24" width="42" height="42" rx="12" fill="#dff1e9"/><text x="41" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#0a6b4b">R</text><text x="78" y="38" font-size="11" font-weight="700" fill="#66736d">Stock value</text><text x="78" y="72" font-size="29" font-weight="700" fill="#18231f">R6,618</text><text x="78" y="99" font-size="11" fill="#66736d">Cash held in inventory</text></g><g transform="translate(330 232)"><rect width="260" height="132" rx="17" fill="#fff" stroke="#dedfd8"/><rect x="20" y="24" width="42" height="42" rx="12" fill="#fff0d8"/><text x="41" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#b76a19">!</text><text x="78" y="38" font-size="11" font-weight="700" fill="#66736d">Low-stock items</text><text x="78" y="72" font-size="29" font-weight="700" fill="#18231f">9</text><text x="78" y="99" font-size="11" fill="#66736d">At or below one pack</text></g><g transform="translate(612 232)"><rect width="260" height="132" rx="17" fill="#fff" stroke="#dedfd8"/><rect x="20" y="24" width="42" height="42" rx="12" fill="#fde8e6"/><text x="41" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#b43b37">0</text><text x="78" y="38" font-size="11" font-weight="700" fill="#66736d">Stockouts</text><text x="78" y="72" font-size="29" font-weight="700" fill="#18231f">0</text><text x="78" y="99" font-size="11" fill="#66736d">No shelves empty</text></g><g transform="translate(894 232)"><rect width="258" height="132" rx="17" fill="#fff" stroke="#dedfd8"/><rect x="20" y="24" width="42" height="42" rx="12" fill="#e1eef7"/><text x="41" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#286490">↗</text><text x="78" y="38" font-size="11" font-weight="700" fill="#66736d">Open orders</text><text x="78" y="72" font-size="29" font-weight="700" fill="#18231f">0</text><text x="78" y="99" font-size="11" fill="#66736d">Approved or on the way</text></g></g>
  <g filter="url(#s)" font-family="Arial"><rect x="48" y="386" width="642" height="278" rx="17" fill="#fff" stroke="#dedfd8"/><text x="74" y="426" font-size="19" font-weight="700" fill="#18231f">Today's focus</text><text x="74" y="449" font-size="11" fill="#66736d">Complete these actions to keep records reliable.</text><g font-size="13"><line x1="74" y1="473" x2="664" y2="473" stroke="#ecece7"/><circle cx="96" cy="510" r="17" fill="#dff1e9"/><text x="96" y="515" text-anchor="middle" font-size="11" font-weight="700" fill="#0a6b4b">1</text><text x="128" y="504" font-weight="700" fill="#18231f">Capture today's sales</text><text x="128" y="523" font-size="11" fill="#66736d">Keep stock and demand up to date</text><line x1="74" y1="546" x2="664" y2="546" stroke="#ecece7"/><circle cx="96" cy="583" r="17" fill="#dff1e9"/><text x="96" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#0a6b4b">2</text><text x="128" y="577" font-weight="700" fill="#18231f">Review low-stock suggestions</text><text x="128" y="596" font-size="11" fill="#66736d">Suggestions respect the R2,500 budget</text><line x1="74" y1="619" x2="664" y2="619" stroke="#ecece7"/></g><rect x="712" y="386" width="440" height="278" rx="17" fill="#fff" stroke="#dedfd8"/><text x="738" y="426" font-size="19" font-weight="700" fill="#18231f">Recent movements</text><text x="738" y="449" font-size="11" fill="#66736d">Latest entries in the stock ledger.</text><text x="932" y="535" font-size="17" font-weight="700" fill="#18231f">No movements yet</text><text x="878" y="561" font-size="12" fill="#66736d">Record a sale or receipt to start the stock ledger.</text></g>
</svg>

